[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "franq_ext"
version = "0.1.0"
description = "Dependency-Aware Entity-Attribute Verification and Targeted Self-Correction for Faithful RAG (extends FRANQ)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FRANQ-EXT project" }]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Heavy deps only needed for the real (GPU) experiment runs. Dev/tests run without these.
full = [
    "torch>=2.1",
    "transformers>=4.44",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.7",
    "datasets>=2.19",
    "matplotlib>=3.7",
    "pandas>=2.0",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
franq-ext-demo = "franq_ext.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["franq_ext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
